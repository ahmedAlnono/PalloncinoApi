version: '3.8'

services:
  palloncino-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: palloncino-api:latest
    container_name: palloncino-api
    restart: unless-stopped
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80;https://+:443
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/PalloncinoDB.sqlite
      - Jwt__Key=${JWT_KEY:-PalloncinoSuperSecretKey2024Min32Chars!}
      - Jwt__Issuer=${JWT_ISSUER:-PalloncinoAPI}
      - Jwt__Audience=${JWT_AUDIENCE:-PalloncinoApp}
      - Jwt__ExpiryInMinutes=60
    volumes:
      # Persist SQLite database
      - palloncino_data:/app/data
      # Persist logs
      - palloncino_logs:/app/logs
      # Persist uploaded files
      - palloncino_uploads:/app/uploads
    networks:
      - palloncino_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Volumes for persistent storage
volumes:
  palloncino_data:
    driver: local
  palloncino_logs:
    driver: local
  palloncino_uploads:
    driver: local

# Networks
networks:
  palloncino_network:
    driver: bridge